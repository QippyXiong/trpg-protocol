name: Publish public npm protocol
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          scope: '@qippyxiong'
      - name: Verify public package configuration
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("package.json")); if(p.license!=="MIT" || p.publishConfig?.registry!=="https://registry.npmjs.org" || p.publishConfig?.access!=="public") throw Error("MIT license and explicit public npm registry required");'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: git diff --exit-code -- dist
      - name: Verify npm authentication is configured
        run: node -e 'if(!process.env.NODE_AUTH_TOKEN) throw Error("Configure the npm publish credential as NPM_TOKEN in repository Secrets")'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm publish --registry=https://registry.npmjs.org --access=public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify public registry version
        run: npm view @qippyxiong/trpg-protocol@$(node -p "require('./package.json').version") version --registry=https://registry.npmjs.org --prefer-online
